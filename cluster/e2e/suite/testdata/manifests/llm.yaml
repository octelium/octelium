kind: Service
metadata:
  name: llm-aimock
spec:
  port: 4010
  mode: LLM
  isPublic: true
  config:
    upstream:
      container:
        port: 4010
        image: ghcr.io/copilotkit/aimock:1.39.0
        resourceLimit:
          cpu:
            millicores: 500
          memory:
            megabytes: 512
    llm:
      protocol: OPENAI
