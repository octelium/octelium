kind: Service
metadata:
  name: essh
spec:
  mode: SSH
  config:
    ssh:
      eSSHMode: true
---
kind: Service
metadata:
  name: ws-echo
spec:
  mode: WEB
  isPublic: true
  port: 80
  config:
    upstream:
      url: http://localhost:{{ .WSEchoPort }}
      user: root
---
kind: Service
metadata:
  name: mcp-echo
spec:
  mode: MCP
  isPublic: true
  port: 80
  config:
    upstream:
      url: http://localhost:{{ .MCPPort }}
      user: root
