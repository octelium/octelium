kind: Service
metadata:
  name: redis
spec:
  mode: TCP
  port: 6379
  config:
    upstream:
      container:
        image: redis
        port: 6379
---
kind: Service
metadata:
  name: nats
spec:
  mode: TCP
  config:
    upstream:
      container:
        image: nats
        port: 4222
---
kind: Service
metadata:
  name: clickhouse
spec:
  mode: TCP
  config:
    upstream:
      container:
        image: clickhouse/clickhouse-server
        port: 9000
        env:
          - name: CLICKHOUSE_USER
            value: octelium
          - name: CLICKHOUSE_PASSWORD
            value: password
---
kind: Service
metadata:
  name: mongo
spec:
  mode: TCP
  config:
    upstream:
      container:
        image: mongo
        port: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: octelium
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: password
---
kind: Service
metadata:
  name: opensearch
spec:
  mode: HTTP
  config:
    upstream:
      container:
        image: opensearchproject/opensearch:latest
        port: 9200
        env:
          - name: discovery.type
            value: single-node
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            value: Password_123456
---
kind: Service
metadata:
  name: s3
spec:
  mode: HTTP
  config:
    upstream:
      container:
        image: rustfs/rustfs
        port: 9000
        env:
          - name: RUSTFS_ACCESS_KEY
            value: octelium
          - name: RUSTFS_SECRET_KEY
            value: password
    http:
      auth:
        sigv4:
          accessKeyID: octelium
          secretAccessKey:
            fromSecret: password
          service: s3
          region: us-east-1
