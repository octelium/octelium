kind: Service
metadata:
  name: mariadb
spec:
  mode: MYSQL
  config:
    upstream:
      container:
        image: mariadb
        port: 3306
        env:
          - name: MARIADB_ROOT_PASSWORD
            value: password
    mysql:
      user: root
      database: mysql
      auth:
        password:
          fromSecret: password
