name: tests-e2e
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Kubernetes distribution"
        required: false
        type: choice
        default: k3s
        options: [k3s, rke2, k8s]
      cni:
        description: "CNI plugin"
        required: false
        type: choice
        default: flannel
        options: [flannel, cilium, calico]
      spiffe:
        description: "Install SPIRE and enable the SPIFFE CSI driver"
        required: false
        type: boolean
        default: false
      arch:
        description: "Architectures to run on"
        required: false
        type: choice
        default: both
        options: [both, amd64, arm64]
      run:
        description: "Only run tests matching this regular expression (go test -run)"
        required: false
        default: ""
env:
  GO_VERSION: "1.26.5"
  SCENARIO: >-
    ${{ inputs.distro || 'k3s' }}-${{ inputs.cni || 'flannel' }}${{ inputs.spiffe && '-spiffe' || '' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.arch == 'amd64' && fromJSON('["ubuntu-24.04"]')
          || inputs.arch == 'arm64' && fromJSON('["ubuntu-24.04-arm"]')
          || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    name: ${{ inputs.distro || 'k3s' }}-${{ inputs.cni || 'flannel' }}-${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Build
        run: |
          go version
          make build-e2e
          make install-cli

      - name: Provision
        run: ./bin/octelium-e2e provision --scenario=${{ env.SCENARIO }}

      - name: Prepare
        run: ./bin/octelium-e2e prepare --scenario=${{ env.SCENARIO }}

      - name: Install
        run: ./bin/octelium-e2e install --scenario=${{ env.SCENARIO }}

      - name: Test
        run: |
          ./bin/octelium-e2e test \
            --scenario=${{ env.SCENARIO }} \
            --artifacts="${{ runner.temp }}/e2e-artifacts" \
            ${{ inputs.run && format('--run={0}', inputs.run) || '' }}

      - name: Collect cluster state on failure
        if: failure()
        run: |
          OUT="${{ runner.temp }}/e2e-artifacts"
          mkdir -p "$OUT"

          kubectl get all -A -o wide > "$OUT/get-all.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$OUT/events.txt" 2>&1 || true
          kubectl describe pods -n octelium > "$OUT/describe-pods.txt" 2>&1 || true
          kubectl get pods -n octelium \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[*].image \
            > "$OUT/pod-images.txt" 2>&1 || true

          for pod in $(kubectl get pods -n octelium -o name 2>/dev/null); do
            name=$(basename "$pod")
            kubectl logs "$pod" -n octelium --all-containers --tail=200 \
              > "$OUT/logs-${name}.txt" 2>&1 || true
            kubectl logs "$pod" -n octelium --all-containers --tail=200 --previous \
              > "$OUT/logs-${name}-previous.txt" 2>&1 || true
          done
          find "$OUT" -name 'logs-*-previous.txt' -size -1c -delete || true

          if kubectl get namespace spire >/dev/null 2>&1; then
            kubectl get csidriver -o wide > "$OUT/spire-csidrivers.txt" 2>&1 || true
            kubectl get all -n spire -o wide > "$OUT/spire-get-all.txt" 2>&1 || true
            kubectl get configmaps -n spire -o yaml > "$OUT/spire-configmaps.txt" 2>&1 || true
            kubectl describe pods -n spire > "$OUT/spire-describe-pods.txt" 2>&1 || true

            for pod in $(kubectl get pods -n spire -o name 2>/dev/null); do
              kubectl logs "$pod" -n spire --all-containers --tail=200 \
                > "$OUT/spire-logs-$(basename "$pod").txt" 2>&1 || true
            done
          fi

          cp /tmp/octelium-e2e-k3s.log "$OUT/" 2>/dev/null || true
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ env.SCENARIO }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
