name: tests-unit-test
permissions:
  contents: read
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
      - main
      - dev*
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
      mariadb:
        image: mariadb:10.8.2
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: password
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create database
        run: psql -h localhost -U postgres -c 'CREATE DATABASE octelium;'
        env:
          PGPASSWORD: postgres
      - name: Run tests
        run: |
          go version
          which go
          gocmd=$(which go)
          sudo -E $gocmd version
          sudo -E $gocmd test github.com/octelium/octelium/...

  test-client:
    name: test-client-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Run client tests
        run: |
          go version
          go test github.com/octelium/octelium/client/...
