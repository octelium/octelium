name: client-install
permissions:
  contents: read
on: workflow_dispatch

jobs:
  test-install:
    name: ${{ matrix.os }} (${{ matrix.arch }}, package manager ${{ matrix.package-manager }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-26-intel, macos-latest, windows-latest]
        package-manager: [auto, "false"]
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-26-intel
            os: macos
            arch: amd64
          - runner: macos-latest
            os: macos
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
    env:
      USE_PACKAGE_MANAGER: ${{ matrix.package-manager }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Bash Installer (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          curl -fsSL https://octelium.com/install.sh | bash

      - name: Run PowerShell Installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          iwr https://octelium.com/install.ps1 -useb | iex
          foreach ($bin in @("octelium", "octeliumctl", "octops")) {
              Split-Path (Get-Command $bin).Source >> $env:GITHUB_PATH
          }

      - name: Verify Version and Files (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          octelium version
          octeliumctl version
          octops version
          if [[ "$USE_PACKAGE_MANAGER" == "false" ]]; then
            test "$(command -v octelium)" = /usr/local/bin/octelium
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            dpkg -s octelium octeliumctl octops > /dev/null
          else
            brew list octelium
          fi

      - name: Verify Version and Files (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          octelium version
          octeliumctl version
          octops version
          $binDir = Split-Path (Get-Command octelium).Source
          if ($env:USE_PACKAGE_MANAGER -eq "false") {
              if ($binDir -ne (Join-Path $HOME ".local\bin")) {
                  Write-Error "octelium was installed to $binDir instead of the binary directory"
                  exit 1
              }
          } elseif (-not (Test-Path (Join-Path $env:ChocolateyInstall "lib\octelium"))) {
              Write-Error "octelium was not installed with Chocolatey"
              exit 1
          }
          foreach ($dll in @("wireguard.dll", "wintun.dll")) {
              $dllPath = Join-Path $binDir $dll
              if (Test-Path $dllPath) {
                  Write-Host "$dll found in bin directory."
              } else {
                  Write-Error "$dll is missing from installation directory!"
                  exit 1
              }
          }
