name: release

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
        os: [linux, darwin, windows]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load workflow environment
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "::error file=.github/workflows/env::Invalid environment assignment"
              exit 1
            fi

            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < .github/workflows/env

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
        run: make build-cli

      - name: Tarball
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd bin
          tar -czvf "octelium-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" octelium
          tar -czvf "octeliumctl-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" octeliumctl
          tar -czvf "octops-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" octops

      - name: Generate checksums (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd bin
          sha256sum *.tar.gz > "checksums-${{ matrix.os }}-${{ matrix.arch }}.txt"

      - name: Save artifacts
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            bin/*.tar.gz
            bin/checksums-${{ matrix.os }}-${{ matrix.arch }}.txt
          retention-days: 1

      - name: Zip for Windows
        if: matrix.os == 'windows'
        shell: bash
        env:
          WIREGUARD_NT_SHA256: 772c0b1463d8d2212716f43f06f4594d880dea4f735165bd68e388fc41b81605
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          set -euo pipefail

          curl --fail --show-error --location --retry 3 \
            --output wireguard.zip \
            https://download.wireguard.com/wireguard-nt/wireguard-nt-0.10.1.zip
          echo "${WIREGUARD_NT_SHA256}  wireguard.zip" | sha256sum --check --strict
          unzip -q wireguard.zip
          cp "./wireguard-nt/bin/${{ matrix.arch }}/wireguard.dll" ./bin

          curl --fail --show-error --location --retry 3 \
            --output wintun.zip \
            https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "${WINTUN_SHA256}  wintun.zip" | sha256sum --check --strict
          unzip -q wintun.zip
          cp "./wintun/bin/${{ matrix.arch }}/wintun.dll" ./bin

          cd bin
          zip "octelium-${{ matrix.os }}-${{ matrix.arch }}.zip" octelium.exe wireguard.dll wintun.dll
          zip "octeliumctl-${{ matrix.os }}-${{ matrix.arch }}.zip" octeliumctl.exe
          zip "octops-${{ matrix.os }}-${{ matrix.arch }}.zip" octops.exe

      - name: Generate checksums (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd bin
          sha256sum *.zip > "checksums-${{ matrix.os }}-${{ matrix.arch }}.txt"

      - name: Save Windows artifacts
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            bin/*.zip
            bin/checksums-${{ matrix.os }}-${{ matrix.arch }}.txt
          retention-days: 1

      - name: Save Windows binaries for MSI
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binaries-${{ matrix.arch }}-${{ github.ref_name }}
          path: bin/*.exe
          retention-days: 1

  package-linux:
    name: Package Linux
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-linux-${{ matrix.arch }}-${{ github.ref_name }}
          path: artifacts

      - name: Extract binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          tar -xzf "artifacts/octelium-linux-${{ matrix.arch }}.tar.gz" -C bin
          tar -xzf "artifacts/octeliumctl-linux-${{ matrix.arch }}.tar.gz" -C bin
          tar -xzf "artifacts/octops-linux-${{ matrix.arch }}.tar.gz" -C bin
          chmod +x bin/*

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=1" >> "$GITHUB_OUTPUT"

      - name: Create DEB packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          DEB_ARCH="$ARCH"
          if [[ "$ARCH" == "amd64" ]]; then
            DEB_ARCH="amd64"
          elif [[ "$ARCH" == "arm64" ]]; then
            DEB_ARCH="arm64"
          fi

          create_deb() {
            local PKG_NAME="$1"
            local PKG_DIR="packaging/deb/${PKG_NAME}_${VERSION}-${RELEASE}_${DEB_ARCH}"

            mkdir -p "${PKG_DIR}/usr/bin"
            mkdir -p "${PKG_DIR}/usr/share/doc/${PKG_NAME}"
            mkdir -p "${PKG_DIR}/DEBIAN"

            cp "bin/${PKG_NAME}" "${PKG_DIR}/usr/bin/"
            cp LICENSE-APACHE "${PKG_DIR}/usr/share/doc/${PKG_NAME}/copyright"

            cat > "${PKG_DIR}/DEBIAN/control" <<CONTROL
          Package: ${PKG_NAME}
          Version: ${VERSION}-${RELEASE}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: George Badawi <contact@octelium.com>
          Description: ${PKG_NAME} - A unified zero trust secure access platform that
           can operate as a remote access VPN, a ZTNA platform, API/AI/MCP gateway,
           a PaaS, an ngrok-alternative and a homelab infrastructure.
          Homepage: https://octelium.com
          License: Apache-2.0
          CONTROL

            dpkg-deb --build "$PKG_DIR"
            mv "${PKG_DIR}.deb" packaging/
          }

          mkdir -p packaging/deb
          create_deb "octelium"
          create_deb "octeliumctl"
          create_deb "octops"

      - name: Create RPM packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          RPM_ARCH="$ARCH"
          if [[ "$ARCH" == "amd64" ]]; then
            RPM_ARCH="x86_64"
          elif [[ "$ARCH" == "arm64" ]]; then
            RPM_ARCH="aarch64"
          fi

          create_rpm() {
            local PKG_NAME="$1"
            local BASE_DIR="packaging/rpm/build/${PKG_NAME}"

            mkdir -p "${BASE_DIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

            cp "bin/${PKG_NAME}" "${BASE_DIR}/SOURCES/"
            cp LICENSE-APACHE "${BASE_DIR}/SOURCES/LICENSE"

            cat > "${BASE_DIR}/SPECS/${PKG_NAME}.spec" <<SPEC
          Name:           ${PKG_NAME}
          Version:        ${VERSION}
          Release:        ${RELEASE}%{?dist}
          Summary:        ${PKG_NAME} - Octelium is a unified zero trust secure access platform
          License:        Apache-2.0
          URL:            https://octelium.com
          Source0:        ${PKG_NAME}
          Source1:        LICENSE

          %define debug_package %{nil}
          %define __strip /bin/true

          %description
          A unified zero trust secure access platform that can operate as a remote access VPN,
          a ZTNA platform, API/AI/MCP gateway, a PaaS, an ngrok-alternative and a homelab infrastructure.

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/licenses/${PKG_NAME}

          install -m 755 %{_sourcedir}/${PKG_NAME} %{buildroot}/usr/bin/${PKG_NAME}
          install -m 644 %{_sourcedir}/LICENSE %{buildroot}/usr/share/licenses/${PKG_NAME}/LICENSE

          %files
          %license /usr/share/licenses/${PKG_NAME}/LICENSE
          %dir /usr/share/licenses/${PKG_NAME}
          /usr/bin/${PKG_NAME}

          %changelog
          * $(date '+%a %b %d %Y') George Badawi <contact@octelium.com> - ${VERSION}-${RELEASE}
          - Release ${VERSION}-${RELEASE}
          SPEC

            rpmbuild --target "$RPM_ARCH" \
              --define "_topdir $(pwd)/${BASE_DIR}" \
              --define "_rpmdir $(pwd)/packaging/rpm" \
              -bb "${BASE_DIR}/SPECS/${PKG_NAME}.spec"
          }

          mkdir -p packaging/rpm
          create_rpm "octelium"
          create_rpm "octeliumctl"
          create_rpm "octops"

          # Move RPMs to flat structure.
          find packaging/rpm -type f -name "*.rpm" -exec mv {} packaging/ \;

      - name: List created packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Contents of packaging directory:"
          ls -la packaging/

      - name: Upload DEB/RPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            packaging/*.deb
            packaging/*.rpm
          retention-days: 1

  package-windows:
    name: Package Windows
    runs-on: windows-2022
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.arch }}-${{ github.ref_name }}
          path: bin

      - name: Download WireGuard and Wintun DLLs
        shell: pwsh
        env:
          WIREGUARD_NT_SHA256: 772c0b1463d8d2212716f43f06f4594d880dea4f735165bd68e388fc41b81605
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          $ErrorActionPreference = 'Stop'

          curl.exe --fail --show-error --location --retry 3 `
            --output wireguard.zip `
            https://download.wireguard.com/wireguard-nt/wireguard-nt-0.10.1.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $wireGuardHash = (Get-FileHash -Algorithm SHA256 wireguard.zip).Hash.ToLowerInvariant()
          if ($wireGuardHash -ne $env:WIREGUARD_NT_SHA256) {
            throw "wireguard.zip SHA-256 mismatch: $wireGuardHash"
          }

          Expand-Archive -Path wireguard.zip -DestinationPath .
          Copy-Item -Path "wireguard-nt/bin/${{ matrix.arch }}/wireguard.dll" -Destination "bin/"

          curl.exe --fail --show-error --location --retry 3 `
            --output wintun.zip `
            https://www.wintun.net/builds/wintun-0.14.1.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $wintunHash = (Get-FileHash -Algorithm SHA256 wintun.zip).Hash.ToLowerInvariant()
          if ($wintunHash -ne $env:WINTUN_SHA256) {
            throw "wintun.zip SHA-256 mismatch: $wintunHash"
          }

          Expand-Archive -Path wintun.zip -DestinationPath .
          Copy-Item -Path "wintun/bin/${{ matrix.arch }}/wintun.dll" -Destination "bin/"

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Create MSI for octelium (with WireGuard)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          .github/scripts/windows/build-msi.ps1 `
            -PackageName "octelium" `
            -Version $env:VERSION `
            -Arch $env:ARCH `
            -IncludeWireGuard

      - name: Create MSI for octeliumctl
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          .github/scripts/windows/build-msi.ps1 `
            -PackageName "octeliumctl" `
            -Version $env:VERSION `
            -Arch $env:ARCH

      - name: Create MSI for octops
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          .github/scripts/windows/build-msi.ps1 `
            -PackageName "octops" `
            -Version $env:VERSION `
            -Arch $env:ARCH

      - name: List created packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Contents of packaging directory:"
          Get-ChildItem -Path packaging -Recurse

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-${{ matrix.arch }}-${{ github.ref_name }}
          path: packaging/*.msi
          retention-days: 1

  package-macos:
    name: Package macOS
    runs-on: macos-14
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-darwin-${{ matrix.arch }}-${{ github.ref_name }}
          path: artifacts

      - name: Extract binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          tar -xzf "artifacts/octelium-darwin-${{ matrix.arch }}.tar.gz" -C bin
          tar -xzf "artifacts/octeliumctl-darwin-${{ matrix.arch }}.tar.gz" -C bin
          tar -xzf "artifacts/octops-darwin-${{ matrix.arch }}.tar.gz" -C bin
          chmod +x bin/*

      - name: Make build script executable
        shell: bash
        run: chmod +x .github/scripts/macos/build-pkg.sh

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create PKG for octelium
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          .github/scripts/macos/build-pkg.sh \
            --package-name octelium \
            --version "$VERSION" \
            --arch "$ARCH"

      - name: Create PKG for octeliumctl
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          .github/scripts/macos/build-pkg.sh \
            --package-name octeliumctl \
            --version "$VERSION" \
            --arch "$ARCH"

      - name: Create PKG for octops
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          .github/scripts/macos/build-pkg.sh \
            --package-name octops \
            --version "$VERSION" \
            --arch "$ARCH"

      - name: List created packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Contents of packaging directory:"
          ls -la packaging/

      - name: Upload PKG artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: packaging/*.pkg
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build, package-linux, package-macos, package-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifact-*
          path: artifacts

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-linux-*
          path: artifacts

      - name: Download macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-macos-*
          path: artifacts

      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-windows-*
          path: artifacts

      - name: Organize files for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          # Copy all release artifacts (tarballs and zips).
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;

          # Copy all package files, avoiding duplicates.
          find artifacts -type f -name "*.deb" -exec cp -n {} release-files/ \;
          find artifacts -type f -name "*.rpm" -exec cp -n {} release-files/ \;
          find artifacts -type f -name "*.pkg" -exec cp -n {} release-files/ \;
          find artifacts -type f -name "*.msi" -exec cp -n {} release-files/ \;

          echo "=== Files prepared for release ==="
          ls -lh release-files/ | wc -l
          echo "files ready"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum * > ../SHA256SUMS
          cd ..

          echo "=== SHA256SUMS content ==="
          cat SHA256SUMS

          mv SHA256SUMS release-files/

      - name: Generate and download SBOM from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching SBOM from GitHub Dependency Graph API..."
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/dependency-graph/sbom" \
            | jq -e '.sbom' > release-files/sbom.json

      - name: Generate release provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS

      - name: Add attestation bundle to release assets
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$ATTESTATION_BUNDLE" release-files/release-attestation.json

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Final release file count ==="
          ls -1 release-files/ | wc -l
          echo ""
          echo "=== Release files ==="
          ls -lh release-files/

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-files/*
          fail_on_unmatched_files: true
