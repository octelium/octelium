name: cluster-components

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - b-*
      - main
      - dev
      - dev-*

jobs:
  build:
    name: Build ${{ matrix.component }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          [
            apiserver,
            dnsserver,
            genesis,
            ingress,
            nocturne,
            gwagent,
            nodeinit,
            authserver,
            portal,
            rscserver,
            vigil,
            octovigil,
          ]
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load workflow environment
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "::error file=.github/workflows/env::Invalid environment assignment"
              exit 1
            fi

            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < .github/workflows/env

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.V_CONTAINER_REGISTRY }}/${{ env.V_ORG }}/octelium-${{ matrix.component }}
          flavor: |
            latest=false
            prefix=
            suffix=-${{ matrix.arch }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.V_CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cluster/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  create-manifest:
    name: Create manifest for ${{ matrix.component }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          [
            apiserver,
            dnsserver,
            genesis,
            ingress,
            nocturne,
            gwagent,
            nodeinit,
            authserver,
            portal,
            rscserver,
            vigil,
            octovigil,
          ]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load workflow environment
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "::error file=.github/workflows/env::Invalid environment assignment"
              exit 1
            fi

            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < .github/workflows/env

      - name: Set is latest
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              LATEST_TAG="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          echo "Latest stable tag: ${LATEST_TAG:-<none>}"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$LATEST_TAG" == "${GITHUB_REF_NAME:-}" ]]; then
            echo "V_IS_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "V_IS_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.V_CONTAINER_REGISTRY }}/${{ env.V_ORG }}/octelium-${{ matrix.component }}
          flavor: |
            latest=${{ env.V_IS_LATEST }}
            prefix=
            suffix=
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.V_CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest with annotations
        shell: bash
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          BASE_IMAGE: ${{ env.V_CONTAINER_REGISTRY }}/${{ env.V_ORG }}/octelium-${{ matrix.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          ANNOTATIONS=()
          while IFS= read -r label; do
            [[ "$label" == *=* ]] || continue

            key="${label%%=*}"
            value="${label#*=}"
            if [[ -n "$key" && -n "$value" ]]; then
              ANNOTATIONS+=("--annotation" "index:${key}=${value}")
            fi
          done <<< "$LABELS"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            echo "Creating manifest for $tag"
            docker buildx imagetools create \
              "${ANNOTATIONS[@]}" \
              -t "$tag" \
              "${BASE_IMAGE}:${VERSION}-amd64" \
              "${BASE_IMAGE}:${VERSION}-arm64"
          done <<< "$TAGS"

  sign:
    name: Sign ${{ matrix.component }} image
    if: github.ref_type == 'tag'
    needs: create-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component:
          [
            apiserver,
            dnsserver,
            genesis,
            ingress,
            nocturne,
            gwagent,
            nodeinit,
            authserver,
            portal,
            rscserver,
            vigil,
            octovigil,
          ]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load workflow environment
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "::error file=.github/workflows/env::Invalid environment assignment"
              exit 1
            fi

            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < .github/workflows/env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.V_CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign release image by digest
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail

          IMAGE="${V_CONTAINER_REGISTRY}/${V_ORG}/octelium-${COMPONENT}"
          VERSION="${GITHUB_REF_NAME#v}"

          MANIFEST_JSON="$(
            docker buildx imagetools inspect \
              "${IMAGE}:${VERSION}" \
              --format '{{json .Manifest}}'
          )"
          DIGEST="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' <<< "$MANIFEST_JSON")"

          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
